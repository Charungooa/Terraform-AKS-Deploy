# github actions workflow for terraform to create github repository.

name: Terraform GitHub Repository Creation
on:
    # push: 
    #   branches:
    #     - main
    #     - master
    #     - dev
    

    workflow_dispatch:
        inputs:
          github_token:
            description: 'Enter your GitHub token'
            required: false
            default: ''

          repo_name:
            description: 'Enter the name of the repository to create'
            required: true
            default: 'my_test_repo2'

          secret_name:
            description: 'Enter the name of the secret to create'
            required: true
            default: 'amit'

          secret_value:
            description: 'Enter the value of the secret to create'
            required: false
            default: ''

          new_secret_value:
            description: 'Enter the new value of the secret to update'
            required: true
            default: '123456789'

          second_secret_name:
            description: 'Enter the name of the second secret to create'
            required: true
            default: 'amit2'

          github_owner:
            description: 'Enter the GitHub owner name'
            required: true
            default: 'charungooa'

          azure_credentials:
            description: 'Enter the Azure credentials for Service Principal'
            required: false
            default: ''

          file_name:
            description: 'Enter the name of the file to create in the repository'
            required: true
            default: '.github/workflows/cicd.yaml'

          ACTION:
            description: 'Action to perform (apply for create/update, destroy for deletion)'
            required: true
            type: choice
            options:
            - apply
            - destroy


env:
  state_file: terraform.tfstate
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
  TF_VAR_repo_name: ${{ github.event.inputs.repo_name }}
  TF_VAR_secret_name: ${{ github.event.inputs.secret_name }}
  TF_VAR_secret_value: ${{ github.event.inputs.secret_value }}
  TF_VAR_new_secret_value: ${{ github.event.inputs.new_secret_value }}
  TF_VAR_second_secret_name: ${{ github.event.inputs.second_secret_name }}
  TF_VAR_github_owner: ${{ github.event.inputs.github_owner }}
  TF_VAR_azure_credentials: ${{ github.event.inputs.azure_credentials || secrets.AZURE_CREDENTIALS }}
  TF_VAR_file_name: ${{ github.event.inputs.file_name }}

  # how can we use export option to load variables into the runner environment.

jobs:
  create_repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

           # Check if the state artifact exists in GitHub
      - name: Ensure jq is available
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq --no-install-recommends
          fi

      - name: Check if State Artifact Exists
        id: check_artifact
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100")
          # Find any artifact that starts with 'terraform-state-run-'
          LATEST=$(echo "$RESPONSE" | jq -r '.artifacts[] | select(.name | startswith("terraform-state-run-")) | .name' | head -1)
          if [ -n "$LATEST" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "artifact_name=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

        # Download previous Terraform state artifact only if it exists
      - name: Download Terraform State
        if: steps.check_artifact.outputs.exists == 'true'
        uses: dawidd6/action-download-artifact@v3
        with:
          name: ${{ steps.check_artifact.outputs.artifact_name }}
          path: .

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform
        run: terraform plan -no-color

      - name: Apply Terraform
        if: ${{github.event.inputs.ACTION == 'apply' }}
        run: terraform apply -auto-approve


      - name: Destroy Terraform
        if: ${{github.event.inputs.ACTION == 'destroy' }}
        run: terraform destroy -auto-approve


      - name: Upload Terraform State
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-run-${{ github.run_id }}
          path: ./terraform-${{ github.run_id }}.tfstate