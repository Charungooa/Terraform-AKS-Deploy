# github actions workflow for terraform to create github repository.

name: Terraform GitHub Repository Creation
on:
  workflow_dispatch:

jobs:
  create_repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1 

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform
        run: terraform plan -var="github_token=${{ secrets.GITHUB_TOKEN }}"